[package]
name = "bamboo-wxasr-infer"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "WeChat offline ASR inference (xnet int8 transducer) for BambooIME"
publish = false

[lib]
name = "bamboo_wxasr_infer"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
